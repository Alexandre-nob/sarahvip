<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Redirecionando...</title>
  <style>
    body {
      background-color: #000000; /* Fundo preto */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden; /* Evita barras de rolagem */
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 18px;
      color: #FFFFFF; /* Texto branco */
      margin-bottom: 20px;
      font-weight: bold;
    }
    .loading {
      animation: rotate 1s linear infinite;
      border: 5px solid #4F4F4F; /* Cinza escuro */
      border-top: 5px solid #ec4899; /* Rosa/Neon moderno para o carregando */
      border-radius: 50%;
      width: 40px;
      height: 40px;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq) return; n=f.fbq=function(){ n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq) f._fbq=n; n.push=n; n.loaded=!0; n.version='2.0';
      n.queue=[]; t=b.createElement(e); t.async=!0;
      t.src=v; s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1673968253270388'); // Seu Pixel aplicado aqui
    fbq('track', 'PageView');
  </script>
</head>
<body onload="redirecionar();">

  <div class="loading-container">
    <h1>Aguarde alguns segundos...</h1>
    <div class="loading"></div>
  </div>

  <script>
    // Seu número de segurança caso o n8n falhe por algum motivo
    const defaultWhatsapp = '556183200152'; 

    async function redirecionar() {
        // Pega os parâmetros de texto que vierem na URL se houver
        const urlParams = new URLSearchParams(window.location.search);
        let textParam = urlParams.get('text') || 'Oi quero ver seus conteudos';

        try {
            // CHAMANDO A SUA WEBHOOK DO N8N (Configurada com a sua rota 'pressel')
            const response = await fetch('https://webhook.canalwpp.com/webhook/pressel-alex', {
                method: 'GET'
            });

            if (!response.ok) {
                throw new Error('Servidor n8n respondeu com erro');
            }

            const data = await response.json();

            let finalWhatsappNumber;
            // Verifica as possíveis propriedades de retorno do seu n8n
            if (data && data.whatsapp && String(data.whatsapp).trim() !== '') { 
                finalWhatsappNumber = data.whatsapp;
            } else if (data && data.numeroSelecionado && String(data.numeroSelecionado).trim() !== '') {
                finalWhatsappNumber = data.numeroSelecionado;
            } else {
                console.error('A propriedade "whatsapp" não foi encontrada. Usando WhatsApp padrão.');
                finalWhatsappNumber = defaultWhatsapp;
            }

            const whatsappRedirectUrl = `https://wa.me/${finalWhatsappNumber}?text=${encodeURIComponent(textParam)}`;
            
            // Dispara o Lead e Redireciona
            if (typeof fbq === 'function') {
                fbq('track', 'Lead');
                setTimeout(() => { window.location.href = whatsappRedirectUrl; }, 400);
            } else {
                window.location.href = whatsappRedirectUrl;
            }

        } catch (error) {
            console.error('Erro ao comunicar com o n8n ou processar resposta:', error);
            // Se der qualquer erro na VPS, joga pro seu número padrão para você nunca perder o lead!
            const fallbackUrl = `https://wa.me/${defaultWhatsapp}?text=${encodeURIComponent(textParam)}`;
            
            if (typeof fbq === 'function') {
                fbq('track', 'Lead');
                setTimeout(() => { window.location.href = fallbackUrl; }, 400);
            } else {
                window.location.href = fallbackUrl;
            }
        }
    }
  </script>
</body>
</html>

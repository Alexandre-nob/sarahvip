<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Sarah — Perfil Verificado</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --glass: rgba(0,0,0,0.48);
    }

    html,body{
      height:100%;
    }

    body{
      margin:0;
      font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:#000;
      color:#fff;
      -webkit-font-smoothing:antialiased;
    }

    .video-bg{
      position:fixed;
      inset:0;
      z-index:-10;
      width:100%;
      height:100%;
      background-image:url('https://s3.canalwpp.com/sarah/fundoperfil.jpeg');
      background-size:cover;
      background-position:center;
      transition:filter 1s ease,transform 14s linear;
    }

    .video-bg.zoom{
      transform:scale(1.1);
      filter:blur(4px);
    }

    .overlay{
      position:fixed;
      inset:0;
      background:linear-gradient(180deg,rgba(0,0,0,0.4),rgba(0,0,0,0.9));
      z-index:-5;
    }

    .card{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:24px;
      padding:24px;
      box-shadow:0 10px 40px -10px rgba(0,0,0,0.5);
    }

    .quiz-step{
      display:none;
    }

    .quiz-step.active{
      display:block;
      animation:fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .btn-quiz{
      width:100%;
      padding:16px;
      margin-top:12px;
      border-radius:12px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      font-weight:600;
      transition:all 0.2s;
      text-align:center;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
    }

    .btn-quiz:active{
      transform:scale(0.98);
      background:rgba(255,255,255,0.2);
    }

    .btn-primary{
      background:linear-gradient(90deg,#ec4899,#f97316);
      border:none;
      color:white;
    }

    .pulse-cta{
      animation:pulse 1.6s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(255,100,150,0.4);
      }

      70%{
        transform:scale(1.02);
        box-shadow:0 10px 30px 0 rgba(255,100,150,0);
      }

      100%{
        transform:scale(1);
        box-shadow:0 0 0 0 rgba(255,100,150,0);
      }
    }

    @media (min-width:769px){
      .mobile-only{
        display:none !important;
      }
    }
  </style>

  <script>
  const messages = [
    'Oi amor, quero ver seus conteúdos 😈',
    'Oi gata, quero desbloquear tudo 🔥',
    'Oi Sarah, quero ver suas fotos privadas 😏',
    'Oi linda, me manda seu conteúdo 👀',
    'Oi bebê, quero acessar tudo agora ❤️',
    'Oi amor, quero entrar no seu VIP 🔞',
    'Oi princesa, quero ver seus vídeos 😈'
  ];

  // VÁRIOS NÚMEROS
  const whatsappNumbers = [
    '556183200152',
    '573123898393',
    '573124671998',
    '573159610615'
  ];

  let currentStep = 1;

  function nextStep(step){

    // vibração no celular
    if(navigator.vibrate){
      navigator.vibrate(30);
    }

    const current = document.getElementById(`step-${currentStep}`);
    const next = document.getElementById(`step-${step}`);

    if(current){
      current.classList.remove('active');
    }

    setTimeout(() => {
      next.classList.add('active');
    },120);

    currentStep = step;

    // efeito final
    if(step === 4){

      document
        .getElementById('bgImage')
        .classList.add('zoom');

      generateLocation();

      // evento pixel
      if(typeof fbq === 'function'){
        fbq('track','InitiateCheckout');
      }
    }
  }

  function generateLocation(){

    const cidades = [
      'Muito perto de você 📍',
      'Na sua região 🔥',
      'Online agora 😈',
      'Disponível hoje ❤️'
    ];

    const randomKm = Math.floor(Math.random() * 25) + 3;

    const randomCidade =
      cidades[Math.floor(Math.random() * cidades.length)];

    const locDisplay =
      document.getElementById('location-display');

    locDisplay.innerHTML = `
      ${randomCidade}<br>
      <span class="text-green-400">
        aproximadamente ${randomKm} km de distância
      </span>
    `;
  }

  function redirectToRandomWhatsapp(){

    const btn =
      document.getElementById('sim-btn');

    if(btn.disabled) return;

    btn.disabled = true;

    btn.innerHTML = 'Conectando... 😈';

    // número aleatório
    const randomNumber =
      whatsappNumbers[
        Math.floor(Math.random() * whatsappNumbers.length)
      ];

    // mensagem aleatória
    const randomMessage =
      messages[
        Math.floor(Math.random() * messages.length)
      ];

    const waUrl =
      `https://wa.me/${randomNumber}?text=${encodeURIComponent(randomMessage)}`;

    // pixel
    if(typeof fbq === 'function'){
      fbq('track','Lead');
    }

    setTimeout(() => {
      window.location.href = waUrl;
    },700);
  }

  // QR CODE DESKTOP
  const qrImg = document.getElementById('qr-img');

  if(qrImg){

    const randomNumber =
      whatsappNumbers[
        Math.floor(Math.random() * whatsappNumbers.length)
      ];

    const waUrl =
      `https://wa.me/${randomNumber}?text=${encodeURIComponent(messages[0])}`;

    qrImg.src =
      `https://chart.googleapis.com/chart?chs=300x300&cht=qr&chl=${encodeURIComponent(waUrl)}&choe=UTF-8`;
  }

  // animação inicial
  window.addEventListener('load', () => {

    const card =
      document.getElementById('quiz-container');

    card.style.opacity = '0';
    card.style.transform = 'translateY(20px)';

    setTimeout(() => {
      card.style.transition = 'all .6s ease';
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
    },100);
  });
</script>
</body>
</html>

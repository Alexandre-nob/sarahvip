<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Sarah — Perfil Verificado</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --glass: rgba(0,0,0,0.48);
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:#000;
      color:#fff;
      -webkit-font-smoothing:antialiased;
    }

    .video-bg{
      position:fixed;
      inset:0;
      z-index:-10;
      width:100%;
      height:100%;
      background-image: url('https://s3.canalwpp.com/sarah/fundoperfil.jpeg');
      background-size:cover;
      background-position:center;
      transition: filter 1s ease, transform 14s linear;
    }
    .video-bg.zoom { transform: scale(1.1); filter: blur(4px); }
    .overlay{ position:fixed; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.9)); z-index:-5; }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
    }

    .quiz-step { display: none; }
    .quiz-step.active { display: block; animation: fadeIn 0.4s ease-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-quiz {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-quiz:active { transform: scale(0.98); background: rgba(255,255,255,0.2); }
    
    .btn-primary {
      background: linear-gradient(90deg, #ec4899, #f97316); 
      border: none;
      color: white;
    }

    .pulse-cta { animation: pulse 1.6s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,100,150,0.4); }
      70% { transform: scale(1.02); box-shadow: 0 10px 30px 0 rgba(255,100,150,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,100,150,0); }
    }

    @media (min-width: 769px) { .mobile-only { display:none !important; } }
  </style>

  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq) return; n=f.fbq=function(){ n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq) f._fbq=n; n.push=n; n.loaded=!0; n.version='2.0';
      n.queue=[]; t=b.createElement(e); t.async=!0;
      t.src=v; s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1673968253270388');
    fbq('track', 'PageView');
<script>
    // --- SUA CENTRAL DE NÚMEROS (Pode colocar os 20 aqui) ---
    // Coloque apenas os números, entre aspas, separados por vírgula.
    const whatsappNumbers = [
      '556183200152', // Celular 1
      '556181898638', // Celular 2
      '573018367073', // Celular 3
      // '551199999994', // Celular 4 (basta tirar as duas barras // para ativar)
      // '551199999995', // Celular 5
      // Adicione até o 20...
    ];

    const messages = [
        'Oi quero ver seus conteudos', 
        'Oi gata quero ver seus conteudos',
        'Oi gatinha quero ver seus conteudos', 
        'Oi anjo quero ver seus conteudos'
    ];

    function nextStep(step) {
      document.querySelectorAll('.quiz-step').forEach(el => el.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
      
      if(step === 4) {
        document.getElementById('bgImage').classList.add('zoom');
        generateLocation();
      }
    }

    // Código do QR Code para quem acessar pelo computador
    const qrImg = document.getElementById('qr-img');
    if(qrImg) {
      // Pega um número aleatório também para o QR code
      const randomQRNumber = whatsappNumbers[Math.floor(Math.random() * whatsappNumbers.length)];
      qrImg.src = `https://chart.googleapis.com/chart?chs=300x300&cht=qr&chl=https://wa.me/${randomQRNumber}&choe=UTF-8`;
    }

    function generateLocation() {
        const minKm = 5;
        const maxKm = 31;
        const randomKm = Math.floor(Math.random() * (maxKm - minKm + 1)) + minKm;
        document.getElementById('location-display').innerHTML = `📍 Perto de você! A somente <span class="text-green-400">${randomKm} km</span>.`;
    }

    // A MÁGICA DA DISTRIBUIÇÃO ACONTECE AQUI
    function redirectToRandomWhatsapp() {
      const btn = document.getElementById('sim-btn');
      btn.disabled = true;
      btn.textContent = 'Verificando vaga...';

      // 1. O código sorteia um número da sua lista de forma totalmente aleatória
      const numeroSorteado = whatsappNumbers[Math.floor(Math.random() * whatsappNumbers.length)];
      
      // 2. Sorteia uma mensagem
      const randomMessage = messages[Math.floor(Math.random() * messages.length)];
      
      // 3. Monta o link do WhatsApp
      const waUrl = `https://wa.me/${numeroSorteado}?text=${encodeURIComponent(randomMessage)}`;
      
      // 4. Marca o Pixel do Meta e Redireciona o Lead
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
        // Espera 400 milissegundos para dar tempo do Meta registrar o evento
        setTimeout(() => { window.location.href = waUrl; }, 400);
      } else {
        window.location.href = waUrl;
      }
    }
  </script>
</body>
</html>

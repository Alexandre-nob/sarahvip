<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Redirecionando...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0b0b0b;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Animação da bolinha girando */
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(37, 211, 102, 0.2);
      border-top-color: #25d366; /* Verde WhatsApp */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #aaaaaa;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Pixel do Facebook -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
      t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s);
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1673968253270388');
    fbq('track', 'PageView');
  </script>
</head>
<body>

  <!-- Elementos visuais -->
  <div class="spinner"></div>
  <div class="text">Redirecionando para o WhatsApp...</div>

  <!-- Lógica de Sorteio e Redirecionamento -->
  <script>
    // Seus números (com código de país e DDD obrigatórios pro wa.me funcionar)
    const numeros = [
      '573134569498',  // DDI 57 (Colômbia)
      '5511986874631'  // DDI 55 (Brasil) + DDD 11
    ];

    // Suas copys de entrada
    const msgs = [
      'Oi vim pelo seu anuncio, quero ver seus conteudos',
      'Oi amor, quero ver seus conteudos',
      'Oi gatinha, quero ver seus conteudos',
      'Oi linda, me fala mais sobre voce',
      'Oi quero ver seus conteudos'
    ];

    function redirecionar() {
      // Sorteia 1 número e 1 mensagem da lista
      const numeroSorteado = numeros[Math.floor(Math.random() * numeros.length)];
      const msgSorteada = msgs[Math.floor(Math.random() * msgs.length)];
      
      // Monta o link da API do WhatsApp
      const url = `https://wa.me/${numeroSorteado}?text=${encodeURIComponent(msgSorteada)}`;

      // Marca a conversão de Lead no Pixel
      if(typeof fbq === 'function'){
        fbq('track', 'Lead');
      }

      // Segura o chumbão na página por 1,5 segundos (pra dar tempo do Pixel enviar os dados) e depois manda pro Zap
      setTimeout(() => {
        window.location.href = url;
      }, 1500);
    }

    // Inicia a contagem assim que a página é aberta
    window.onload = redirecionar;
  </script>
</body>
</html>

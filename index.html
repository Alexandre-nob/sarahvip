<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Andressa — 1 vaga disponível</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#0b0b0b;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

    /* ── TOPO STATUS BAR ── */
    .topbar{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:#1a1a1a;
      padding:10px 16px;
      display:flex;align-items:center;gap:12px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .avatar-wrap{position:relative;flex-shrink:0}
    .avatar-wrap img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #25d366}
    .online-dot{
      position:absolute;bottom:1px;right:1px;
      width:11px;height:11px;background:#25d366;
      border-radius:50%;border:2px solid #1a1a1a;
    }
    .topbar-info{flex:1}
    .topbar-name{font-weight:700;font-size:.95rem}
    .topbar-status{font-size:.72rem;color:#25d366;display:flex;align-items:center;gap:4px}
    .topbar-status::before{content:'';display:inline-block;width:6px;height:6px;background:#25d366;border-radius:50%;animation:blink 1.2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .badge{
      background:#ec4899;color:#fff;font-size:.65rem;font-weight:800;
      padding:3px 8px;border-radius:99px;letter-spacing:.5px;
    }

    /* ── CHAT AREA ── */
    .chat{
      padding:70px 14px 160px;
      max-width:480px;margin:0 auto;
      display:flex;flex-direction:column;gap:6px;
    }

    .bubble{
      max-width:82%;padding:10px 14px;border-radius:18px;
      font-size:.9rem;line-height:1.5;
      opacity:0;transform:translateY(8px);
      transition:opacity .35s ease,transform .35s ease;
      word-break:break-word;
    }
    .bubble.in{
      background:#1e2c3a;border-bottom-left-radius:4px;align-self:flex-start;
    }
    .bubble.out{
      background:linear-gradient(135deg,#ec4899,#f97316);
      border-bottom-right-radius:4px;align-self:flex-end;text-align:right;
    }
    .bubble.show{opacity:1;transform:translateY(0)}
    .bubble img,.bubble video{
      width:100%;border-radius:12px;margin-top:4px;max-width:240px;display:block;
    }

    .typing{
      display:flex;align-items:center;gap:4px;padding:12px 16px;
      background:#1e2c3a;border-radius:18px;border-bottom-left-radius:4px;
      align-self:flex-start;opacity:0;transition:opacity .3s;
    }
    .typing.show{opacity:1}
    .typing span{
      width:7px;height:7px;background:#aaa;border-radius:50%;
      animation:dot .9s infinite;display:inline-block;
    }
    .typing span:nth-child(2){animation-delay:.15s}
    .typing span:nth-child(3){animation-delay:.3s}
    @keyframes dot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

    /* ── CTA FIXO ── */
    .cta-bar{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      background:linear-gradient(180deg,transparent,#0b0b0b 40%);
      padding:20px 16px 28px;
      display:flex;flex-direction:column;align-items:center;gap:10px;
    }
    .cta-btn{
      width:100%;max-width:480px;
      padding:18px;border:none;border-radius:16px;
      background:linear-gradient(90deg,#25d366,#128c7e);
      color:#fff;font-size:1.05rem;font-weight:800;
      cursor:pointer;letter-spacing:.3px;
      box-shadow:0 8px 30px rgba(37,211,102,.35);
      animation:ctaPulse 1.8s infinite;
      display:none; /* aparece depois das mensagens */
    }
    @keyframes ctaPulse{
      0%,100%{box-shadow:0 8px 30px rgba(37,211,102,.35)}
      50%{box-shadow:0 8px 50px rgba(37,211,102,.6)}
    }
    .cta-btn.show{display:block}
    .cta-note{font-size:.7rem;color:rgba(255,255,255,.35);text-align:center}

    .vagas{
      background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.3);
      color:#ec4899;font-size:.7rem;font-weight:700;
      padding:5px 14px;border-radius:99px;
    }

    /* Loading spinner dentro do botão */
    .btn-loading{display:none;width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <!-- Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
      t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s);
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1673968253270388');
    fbq('track','PageView');
  </script>
</head>
<body>

  <!-- Topbar WhatsApp falso -->
  <div class="topbar">
    <div class="avatar-wrap">
      <img src="https://s3.canalwpp.com/sarah/fotoperfil.jpeg" alt="Andressa">
      <span class="online-dot"></span>
    </div>
    <div class="topbar-info">
      <div class="topbar-name">Andressa 🔥</div>
      <div class="topbar-status">online agora</div>
    </div>
    <span class="badge">1 vaga</span>
  </div>

  <!-- Chat simulado -->
  <div class="chat" id="chat"></div>

  <!-- CTA fixo -->
  <div class="cta-bar">
    <span class="vagas" id="vagas-txt">⚡ Apenas 1 vaga disponível agora</span>
    <button class="cta-btn" id="cta-btn" onclick="entrar()">
      <span id="btn-txt">💬 Entrar na conversa com a Andressa</span>
      <div class="btn-loading" id="btn-spin"></div>
    </button>
    <span class="cta-note">Grátis · Resposta em segundos · Conteúdo exclusivo</span>
  </div>

  <script>
    // ── CONFIG ──
    const PRESSEL_URL   = 'https://webhook.canalwpp.com/webhook/pressel-alex';
    const FALLBACK_NUM  = '556183200152';
    const NOME_MODELO   = 'Andressa';

    const msgs = [
      'Oi vim pelo seu anuncio, quero ver seus conteudos',
      'Oi amor, quero ver seus conteudos',
      'Oi gatinha, quero ver seus conteudos',
      'Oi linda, me fala mais sobre voce',
      'Oi quero ver seus conteudos'
    ];

    // ── SEQUÊNCIA DE MENSAGENS DO CHAT ──
    // tipo: 'in' (dela) | 'out' (resposta automática do cara) | 'img' | 'typing'
    const sequence = [
      {t:'typing', delay:0,   dur:1200},
      {t:'in',  delay:1200, text:'oi amor 😘 vi que você clicou aqui, que bom que veio'},
      {t:'typing', delay:2800, dur:1000},
      {t:'in',  delay:3800, text:'to online agora aqui no zap esperando você'},
      {t:'typing', delay:5200, dur:1400},
      {t:'in',  delay:6600, text:'posso te mandar uma coisinha especial? 🙈'},
      {t:'out', delay:8000, text:'pode sim'},
      {t:'typing', delay:9000, dur:1800},
      {t:'img', delay:10800,src:'https://s3.canalwpp.com/sarah/fotoperfil.jpeg'},
      {t:'typing', delay:12200, dur:1200},
      {t:'in',  delay:13400, text:'é só uma prévia amor... o melhor tá no meu zap 🔥'},
      {t:'in',  delay:14800, text:'você quer ver tudo? pode ser agora mesmo 😏'},
      // CTA aparece aqui
      {t:'cta', delay:16200},
    ];

    const chat = document.getElementById('chat');

    function addBubble(type, content){
      const el = document.createElement('div');
      if(type === 'in' || type === 'out'){
        el.className = `bubble ${type}`;
        el.textContent = content;
      } else if(type === 'img'){
        el.className = 'bubble in';
        const img = document.createElement('img');
        img.src = content;
        img.alt = '';
        el.appendChild(img);
      } else if(type === 'typing'){
        el.className = 'typing';
        el.innerHTML = '<span></span><span></span><span></span>';
        el.id = 'typing-ind';
      }
      chat.appendChild(el);
      setTimeout(()=>el.classList.add('show'),50);
      el.scrollIntoView({behavior:'smooth',block:'end'});
      return el;
    }

    function removeTyping(){
      const t = document.getElementById('typing-ind');
      if(t) t.remove();
    }

    let typingEl = null;

    sequence.forEach(step => {
      setTimeout(()=>{
        if(step.t === 'typing'){
          removeTyping();
          typingEl = addBubble('typing','');
          setTimeout(()=>removeTyping(), step.dur);
        } else if(step.t === 'cta'){
          document.getElementById('cta-btn').classList.add('show');
        } else {
          removeTyping();
          addBubble(step.t, step.text || step.src);
        }
      }, step.delay);
    });

    // contador de vagas falso (urgência)
    let vagas = 1;
    const vagasTxt = document.getElementById('vagas-txt');
    setInterval(()=>{
      if(Math.random() < 0.15 && vagas < 3){
        vagas++;
        vagasTxt.textContent = `⚡ ${vagas} pessoas olhando agora`;
      }
    }, 8000);

    async function entrar(){
      const btn = document.getElementById('cta-btn');
      const txt = document.getElementById('btn-txt');
      const spin = document.getElementById('btn-spin');
      btn.disabled = true;
      txt.style.display = 'none';
      spin.style.display = 'block';

      const msg = msgs[Math.floor(Math.random()*msgs.length)];
      let numero = FALLBACK_NUM;

      try{
        const r = await fetch(PRESSEL_URL,{method:'GET'});
        if(r.ok){
          const d = await r.json();
          if(d && (d.whatsapp || d.numeroSelecionado)){
            numero = d.whatsapp || d.numeroSelecionado;
          }
        }
      }catch(e){console.warn('pressel fallback',e)}

      const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
      if(typeof fbq==='function'){
        fbq('track','Lead');
        setTimeout(()=>{window.location.href=url},400);
      } else {
        window.location.href=url;
      }
    }
  </script>
</body>
</html>
